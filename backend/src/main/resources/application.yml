server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: short-video-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
